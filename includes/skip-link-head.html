<script>
document.addEventListener("DOMContentLoaded", function () {
  if (document.querySelector(".skip-link")) return;
  var targetId = "quarto-document-content";
  var link = document.createElement("a");
  link.className = "skip-link";
  link.href = "#" + targetId;
  link.textContent = "Skip to main content";
  if (document.body.firstChild) {
    document.body.insertBefore(link, document.body.firstChild);
  } else {
    document.body.appendChild(link);
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var toggles = document.querySelectorAll(
    'div[data-bs-toggle="collapse"][data-bs-target]'
  );
  toggles.forEach(function (el) {
    if (!el.hasAttribute("role")) {
      el.setAttribute("role", "button");
    }
    if (!el.hasAttribute("tabindex")) {
      el.setAttribute("tabindex", "0");
    }
    el.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        el.click();
      }
    });
  });

  var sidebarGlass = document.getElementById("quarto-sidebar-glass");
  if (sidebarGlass && !sidebarGlass.getAttribute("aria-label")) {
    sidebarGlass.setAttribute("aria-label", "Close sidebar overlay");
  }

  var scrollableOutputs = document.querySelectorAll(
    ".cell-output.cell-output-display:not(.cell-output-markdown)"
  );
  scrollableOutputs.forEach(function (el) {
    if (!el.hasAttribute("tabindex")) {
      el.setAttribute("tabindex", "0");
    }
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var prefersReducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );
  if (prefersReducedMotion.matches) return;

  var isModifiedClick = function (event) {
    return (
      event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0
    );
  };

  var shouldAnimateNavigation = function (anchor) {
    if (!anchor || !anchor.href) return false;
    if (anchor.target && anchor.target.toLowerCase() === "_blank") return false;
    if (anchor.hasAttribute("download")) return false;

    var nextUrl = new URL(anchor.href, window.location.href);
    if (nextUrl.origin !== window.location.origin) return false;
    if (nextUrl.pathname === window.location.pathname && nextUrl.hash) return false;

    return true;
  };

  document.addEventListener("click", function (event) {
    if (isModifiedClick(event)) return;

    var anchor = event.target.closest("a");
    if (!shouldAnimateNavigation(anchor)) return;

    event.preventDefault();
    document.body.classList.add("page-is-leaving");
    window.setTimeout(function () {
      window.location.assign(anchor.href);
    }, 180);
  });
});
</script>

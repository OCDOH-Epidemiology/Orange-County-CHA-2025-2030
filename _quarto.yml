project:
  type: book
  output-dir: docs
  execute-dir: project
  resources:
    - "pdfs/**"
  # Pre-render hook regenerates table/figure include files from the workbook
  # (data/raw/workbook.xlsx) into chapters/_generated/objects/ before each render.
  # Add more lines pointing at other chapters as you build them out.
  pre-render:
    - bash scripts/generate_objects.sh
  post-render:
    - node scripts/patch_quarto_search.js

lang: en

book:
  title: "Orange County Community Health Assessment 2025-2030"
  subtitle: ""
  # google-analytics: "G-XXXXXXXXXX"
  downloads: [pdf]
  chapters:
    - index.qmd
    - chapters/01-letter.qmd
    - chapters/02-Data Sources and Indicator Selection.qmd
    - chapters/03-executive-summary.qmd
    - chapters/04-OCDOH.qmd
    - chapters/05-demographics.qmd
    - chapters/06-mortality.qmd
    - chapters/07-SDOH.qmd
    - chapters/08-leading-health-issues.qmd
    - chapters/09-Health Behaviors.qmd
    - chapters/10-Hanlon Method.qmd
    - chapters/11-Health Summit.qmd
    - chapters/12-Community Input.qmd
    - chapters/13-Triangulate the Data.qmd
    - chapters/14-Community Health Improvement Foundation.qmd
    - chapters/15-Appendices.qmd
  sidebar:
    style: docked
    search: true
    collapse-level: 2

bibliography: references.bib
csl: styles/vancouver.csl
reference-location: section

format:
  html:
    theme:
      - default
      - theme.scss
    css: custom-citation-styles.css
    include-in-header: includes/skip-link-head.html
    include-before-body: includes/skip-to-main.html
    include-after-body: references-dropdown.html
    toc: true
    toc-depth: 3
    page-layout: full
    code-fold: true
    code-tools: false
    number-sections: true
    smooth-scroll: false
    fig-cap-location: top
    tbl-cap-location: top
  pdf:
    documentclass: report
    include-in-header:
      - includes/pdf-table-packages.tex

execute:
  freeze: false

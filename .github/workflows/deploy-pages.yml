# Deploy the Quarto book from docs/ to GitHub Pages.
# Replaces the built-in "Deploy from a branch" flow, which can hang forever
# in deployment_in_progress and then time out after 10 minutes.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # Note: deploy-pages caps timeout at 600000ms (10m). concurrency.cancel-in-progress
        # avoids wedged overlapping deploys that leave status stuck on deployment_in_progress.
